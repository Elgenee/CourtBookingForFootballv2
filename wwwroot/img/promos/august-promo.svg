<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">August promo placeholder</title>
  <desc id="desc">A branded August promotion placeholder with schedule tiles and court colors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b942"/>
      <stop offset="0.48" stop-color="#ffb627"/>
      <stop offset="1" stop-color="#0f4c81"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="72" y="76" width="816" height="388" rx="18" fill="#ffffff" fill-opacity="0.18"/>
  <g transform="translate(100 112)">
    <rect x="0" y="0" width="270" height="270" rx="16" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="0" y="0" width="270" height="74" rx="16" fill="#0f4c81"/>
    <text x="34" y="50" fill="#ffffff" font-family="Source Sans Pro, Arial, sans-serif" font-size="36" font-weight="700">AUG</text>
    <text x="36" y="182" fill="#0f4c81" font-family="Source Sans Pro, Arial, sans-serif" font-size="92" font-weight="700">08</text>
    <text x="42" y="222" fill="#0a3a64" font-family="Source Sans Pro, Arial, sans-serif" font-size="24" font-weight="700">Weekday Rates</text>
  </g>
  <g fill="#ffffff" fill-opacity="0.34">
    <circle cx="706" cy="152" r="58"/>
    <circle cx="790" cy="298" r="92"/>
    <circle cx="626" cy="370" r="44"/>
  </g>
  <text x="424" y="216" fill="#ffffff" font-family="Source Sans Pro, Arial, sans-serif" font-size="58" font-weight="800">August Promo</text>
  <text x="428" y="264" fill="#ffffff" fill-opacity="0.88" font-family="Source Sans Pro, Arial, sans-serif" font-size="28">Book selected court schedules</text>
  <text x="428" y="306" fill="#ffffff" fill-opacity="0.88" font-family="Source Sans Pro, Arial, sans-serif" font-size="28">and enjoy special rates.</text>
